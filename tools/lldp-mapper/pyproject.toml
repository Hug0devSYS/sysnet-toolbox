[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lldp-mapper"
version = "0.1.0"
description = "LLDP/CDP topology discovery over SNMP with duplex, speed, auto-negotiation and native VLAN mismatch detection."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hug0devSYS" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lldp-mapper = "lldp_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
