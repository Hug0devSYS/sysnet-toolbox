[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nftlint"
version = "0.1.0"
description = "Static analysis of nftables / iptables-save rulesets: shadowed and unreachable rules, permissive policies, and exposure of listening sockets."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hug0devSYS" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Firewalls",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nftlint = "nftlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
