#config-version=FGT60F-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=1234567890
#buildno=1517
#global_vdom=1
config system global
    set hostname "fw-branch1"
    set admintimeout 10
    set timezone 28
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.10 255.255.255.248
        set allowaccess ping https ssh
        set type physical
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh http
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2xyzxyzxyzxyzxyzxyzxyzxyzxyzxyzxyz=
    next
end
config firewall address
    edit "srv-web"
        set subnet 10.10.0.10 255.255.255.255
    next
    edit "srv-mail"
        set subnet 10.10.0.11 255.255.255.255
    next
end
config firewall addrgrp
    edit "dmz-servers"
        set member "srv-web" "srv-mail"
    next
end
config firewall policy
    edit 1
        set name "lan-to-wan"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "block-tor"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "tor-exit-nodes"
        set schedule "always"
        set service "ALL"
    next
end
config vpn ipsec phase1-interface
    edit "to-hq"
        set interface "wan1"
        set remote-gw 203.0.113.1
        set psksecret ENC AbCdEfGhIjKlMnOpQrStUvWxYz0123456789==
    next
end
