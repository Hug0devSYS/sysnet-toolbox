#config-version=FGT60F-7.2.6-FW-build1575-231010:opmode=0:vdom=0:user=admin
#conf_file_ver=2234567890
#buildno=1575
#global_vdom=1
config system global
    set hostname "fw-branch1"
    set admintimeout 5
    set timezone 28
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 198.51.100.10 255.255.255.248
        set allowaccess ssh ping https
        set type physical
    next
    edit "internal"
        set vdom "root"
        set ip 10.10.0.1 255.255.255.0
        set allowaccess ping https ssh
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set password ENC SH2xyzxyzxyzxyzxyzxyzxyzxyzxyzxyzxyz=
    next
end
config firewall address
    edit "srv-web"
        set subnet 10.10.0.10 255.255.255.255
    next
    edit "srv-mail"
        set subnet 10.10.0.11 255.255.255.255
    next
    edit "srv-dns"
        set subnet 10.10.0.12 255.255.255.255
    next
end
config firewall addrgrp
    edit "dmz-servers"
        set member "srv-mail" "srv-web" "srv-dns"
    next
end
config firewall policy
    edit 2
        set name "block-tor"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "tor-exit-nodes"
        set schedule "always"
        set service "ALL"
    next
    edit 1
        set name "lan-to-wan"
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
    next
end
config vpn ipsec phase1-interface
    edit "to-hq"
        set interface "wan1"
        set remote-gw 203.0.113.1
        set psksecret ENC ZzYyXxWwVvUuTtSsRrQqPpOoNnMmLlKkJjIi==
    next
end
