version 22.4R3.25;
system {
    host-name mx-edge1;
    root-authentication {
        encrypted-password "$6$abc$KJHGFDSAkjhgfdsa1234567890"; ## SECRET-DATA
    }
    name-server {
        192.0.2.53;
        192.0.2.54;
    }
    services {
        ssh {
            root-login deny;
        }
        telnet;
    }
}
interfaces {
    ge-0/0/0 {
        description "Uplink to ISP A";
        unit 0 {
            family inet {
                filter {
                    input PROTECT-RE;
                }
                address 198.51.100.2/30;
            }
        }
    }
    inactive: ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.1.0.1/24;
            }
        }
    }
}
policy-options {
    policy-statement EXPORT-ISP {
        term aggregates {
            from protocol aggregate;
            then accept;
        }
        term reject-all {
            then reject;
        }
    }
}
firewall {
    family inet {
        filter PROTECT-RE {
            term ssh {
                from {
                    source-address {
                        10.0.0.0/8;
                    }
                    protocol tcp;
                    destination-port ssh;
                }
                then accept;
            }
            term bgp {
                from {
                    protocol tcp;
                    port bgp;
                }
                then accept;
            }
            term icmp {
                from {
                    protocol icmp;
                }
                then accept;
            }
            term default-deny {
                then {
                    discard;
                }
            }
        }
    }
}
protocols {
    bgp {
        group ISP-A {
            type external;
            export [ EXPORT-ISP DEFAULT-DENY ];
            peer-as 64500;
            neighbor 198.51.100.1;
        }
    }
}
snmp {
    community s3cr3t {
        authorization read-only;
    }
}
