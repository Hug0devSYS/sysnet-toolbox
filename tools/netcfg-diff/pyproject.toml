[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netcfg-diff"
version = "0.1.0"
description = "Semantic diff of network device configurations: Cisco IOS/IOS-XE/NX-OS/IOS-XR/EOS, Junos and FortiOS."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hug0devSYS" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
netcfg-diff = "netcfg_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
