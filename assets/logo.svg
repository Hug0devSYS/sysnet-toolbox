<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="sysnet-toolbox logo">
  <title>sysnet-toolbox</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13203a"/>
      <stop offset="1" stop-color="#0a1222"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22a6c9"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#2b3f63" stroke-width="6"/>
  <!-- links -->
  <g stroke="#3b82f6" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="210" x2="136" y2="120"/>
    <line x1="256" y1="210" x2="376" y2="120"/>
    <line x1="256" y1="210" x2="120" y2="270"/>
    <line x1="256" y1="210" x2="392" y2="270"/>
    <line x1="136" y1="120" x2="376" y2="120" stroke="#1e3a6b"/>
  </g>
  <!-- edge nodes -->
  <g fill="#0a1222" stroke="#60a5fa" stroke-width="12">
    <circle cx="136" cy="120" r="30"/>
    <circle cx="376" cy="120" r="30"/>
    <circle cx="120" cy="270" r="30"/>
    <circle cx="392" cy="270" r="30"/>
  </g>
  <!-- core node -->
  <circle cx="256" cy="210" r="54" fill="url(#core)"/>
  <circle cx="256" cy="210" r="20" fill="#0a1222"/>
  <!-- terminal prompt -->
  <g fill="none" stroke="#4ade80" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="150,352 200,388 150,424"/>
  </g>
  <rect x="226" y="410" width="136" height="22" rx="11" fill="#4ade80"/>
</svg>
